<style>
/* Thoughts design system. Layout: one phone screen. A header with a heavy rule, then flush tiles
   in palette E (Painted jungle), three across, that scroll down into more rows. Serif for the voice, sans for the structure, weight 400 only. */
:root {
  --paper: #FFFFFF; --raised: #FFFFFF; --ink: #000000; --muted: #5A5A5A; --crumb: #858585; --hairline: #E2E2E2;
  --cobalt: #538DBA; --cobalt-deep: #2871A4; --forest: #047742; --forest-deep: #0A5C22; --blush: #D3C0CA;
  --ochre: #B37718; --umber: #3F2D23; --on-accent: #FFFFFF; --link: #2871A4; --scrim: rgba(0, 0, 0, .45);
  --d-aqua: #A1CDD7; --d-sky: #5CAACC; --d-cerulean: #269ACE; --d-cobalt: #0E6FA6; --d-navy: #203B68;
  --d-green: #41A67A; --d-sea: #5AADA6; --d-lemon: #F9E688; --d-chalk: #F4F2F2; --d-plum: #A1579E;
  --m-ink: #000000; --m-blue: #2871A4; --m-red: #B37718; --m-green: #047742; --m-hl: #F9E688;
  --serif: "Newsreader", "Times New Roman", Georgia, serif;
  --sans: "Figtree", "Helvetica Neue", system-ui, sans-serif;
  --tile-font: "Futura", "Jost", "Helvetica Neue", Arial, sans-serif; /* text inside squares only */
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #000000; --raised: #111111; --ink: #FFFFFF; --muted: #A6A6A6; --crumb: #7A7A7A; --hairline: #2A2A2A; --link: #538DBA; --scrim: rgba(0, 0, 0, .65);
    --m-ink: #FFFFFF; --m-blue: #538DBA;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #000000; --raised: #111111; --ink: #FFFFFF; --muted: #A6A6A6; --crumb: #7A7A7A; --hairline: #2A2A2A; --link: #538DBA; --scrim: rgba(0, 0, 0, .65);
  --m-ink: #FFFFFF; --m-blue: #538DBA;
  color-scheme: dark;
}

html { height: 100%; box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
body {
  height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none;
  background: var(--paper); color: var(--ink); font: 400 15px/20px var(--sans); letter-spacing: .02em;
  -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
}
button, input, textarea { font: inherit; letter-spacing: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
svg { display: block; }
/* Titles drawn as icons: a house for all thoughts, an island for the mind tree */
h1.glyph { display: flex; align-items: center; top: 0 !important; height: 40px; }
h1.glyph .ic { width: 30px; height: 30px; stroke-width: 1.4; }
.trail .crumb-home { display: inline-flex; align-items: center; padding: 0; }
.trail .crumb-home .ic { width: 14px; height: 14px; transform: translateY(-.25px); } /* centred on the › arrows */
/* Everything reads in lower case (display only: what you type is kept as typed). The notepad's own writing is left alone. */
body, body *, body ::placeholder { text-transform: lowercase !important; }
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: square; stroke-linejoin: miter; }

#app { height: 100%; max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; }

/* Header: icon buttons, title, heavy rule below */
#bar[hidden] { display: none; }
#bar { position: relative; display: flex; align-items: center; gap: 12px; padding: 8px 16px 8px; height: 53px; flex: none; /* same height on every screen so nothing jumps */ border-bottom: 3px solid var(--ink); }
.brand { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
.round.flip .ic { transform: scaleX(-1); } /* the tree sits left of home, so its way back points right */
.brand h1 { position: relative; top: .11em; /* sit the letters (ascenders to baseline) on the button's middle */ margin: 0; font: 400 min(21px, 5.2vw)/28px var(--serif); letter-spacing: .08em; white-space: nowrap; overflow: hidden; text-overflow: clip; min-width: 0; }
.round {
  flex: none; width: 40px; height: 40px; display: grid; place-items: center;
  border: 1.5px solid var(--ink); border-radius: 2px;
}
#bar .round { width: 30px; height: 30px; border: 0; } /* just the arrow, the same size as the house and island icons */
#bar .round.glyphbtn .ic { width: 19.5px; height: 19.5px; } /* island and house icons: as tall as the title's tallest letters */
#bar #treeBtn .ic { width: 17px; height: 17px; }
#bar .round:not(.glyphbtn) .ic { width: 15px; height: 15px; stroke-width: 2.8; } /* half size, same line thickness as the house icon */
.chip {
  flex: none; height: 40px; padding: 0 14px; display: inline-flex; align-items: center;
  border: 1.5px solid var(--ink); border-radius: 2px; font: 400 15px/20px var(--sans); letter-spacing: .02em;
}
.zoom button.sign.armed { background: #B3261E; color: #fff; border-color: #B3261E; font-size: 15px; padding: 0 10px; }
#hint .zoom button.sign.on { background: #000; color: #fff; }
.tree .dels { pointer-events: none; }
.tree .mdel { position: absolute; z-index: 4; border-radius: 50%; background: #fff; border: 1.5px solid #000; color: #000; display: grid; place-items: center; padding: 0; font-family: var(--sans); font-weight: 500; line-height: 1; cursor: pointer; }
.tree .mdel.mgrow { background: none; border: 0; display: none; } /* hidden unless its island is up close (#growCss shows it) */ /* no circle, like the bar (Bell v186) */
.tree .mgrow svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.tree .mdel.armed { background: #B3261E; border-color: #B3261E; color: #fff; }
.tree .mdel:not(.mgrow) { background: none; border: 0; border-radius: 0; overflow: visible; }
.tree .mdel .ic { width: 100%; height: 100%; stroke-linecap: round; stroke-linejoin: round; }
.tree .mdel { color: var(--ink); }
.tree .mdel .ic { stroke-width: 1.96; } /* lines as thick on screen as the bar's 34px icons, in their colour (Bell v197) */
.tree .mdel.armed .ic path:first-child { fill: #B3261E; stroke: #B3261E; }
.tree .mdel.armed .ic path + path { stroke: #fff; }
.tree .isle-del circle { fill: #fff; stroke: #000; stroke-width: var(--lw, 1.5px); }
.tree .isle-del path { stroke: #000; stroke-linecap: round; }
.tree .isle-del.armed circle { fill: #B3261E; stroke: #B3261E; }
.tree .isle-del.armed path { stroke: #fff; }
.zoom button.sign { min-width: 44px; font-size: 26px !important; line-height: 1; padding-left: 0; padding-right: 0; }
#undoBtn:disabled { opacity: .3; cursor: default; }
.crumbs { flex: 1; min-width: 0; }
.crumbs:has(.trail) { margin-top: 4px; } /* keep the trail below the back button's top edge */
.trail + .here { line-height: 24px; }
.trail + h1.glyph { height: 26px; }
.trail + h1.glyph .ic { width: 24px; height: 24px; }
.trail { display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow-x: auto; scrollbar-width: none; font: 400 15px/18px var(--serif); letter-spacing: 0; color: var(--crumb); } /* same face as the title */
.trail::-webkit-scrollbar { display: none; }
.trail button { padding: 0; color: var(--crumb); }
.path { display: flex; align-items: baseline; gap: 8px; overflow-x: auto; scrollbar-width: none; white-space: nowrap; } /* parents and title on one line: the title never moves down */
.path::-webkit-scrollbar { display: none; }
.path > button, .path > span { flex: none; padding: 0; position: relative; top: .11em; font: 400 min(21px, 5.2vw)/28px var(--serif); letter-spacing: .08em; color: var(--crumb); }
.path > .here { flex: none; overflow: visible; }
.here.solo { position: relative; top: .11em; } /* alone in the bar: sit the letters on the button's middle */
.here { margin: 0; font: 400 min(21px, 5.2vw)/28px var(--serif); letter-spacing: .08em; /* same type as the home title */ white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.upzone {
  position: absolute; inset: 8px 16px 10px; z-index: 5; display: none; align-items: center; justify-content: center; gap: 8px;
  border: 1.5px dashed var(--ink); border-radius: 2px; background: var(--paper); color: var(--ink);
  font: 400 15px/20px var(--sans); letter-spacing: .04em; text-transform: uppercase; padding: 0 12px; white-space: nowrap; overflow: hidden;
}
body.dragging .upzone { display: flex; }
.upzone span { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.upzone.drop-into { background: var(--forest); color: var(--on-accent); border: 1.5px solid var(--forest); }
.round.drop-into { background: var(--forest); color: var(--on-accent); border-color: var(--forest); }

/* Board: flush tiles, the colour change is the only edge */
#stage {
  flex: 1; min-height: 0; position: relative;
  overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; scroll-snap-type: y proximity;
}
.grid { display: grid; min-height: 100%; grid-template-columns: repeat(6, minmax(0, 1fr)); grid-auto-rows: var(--rowH, 30vh); } /* 6 = room for rows of 1, 2 or 3 */
.grid > .slot[data-rs] { scroll-snap-align: start; }

.slot {
  position: relative; overflow: hidden; cursor: pointer; outline: none;
  background: var(--tile, #F2EDE4); color: var(--on, #000);
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: manipulation;
}
.slot:focus-visible { box-shadow: inset 0 0 0 3px var(--paper), inset 0 0 0 5px var(--ink); }
.slot.pressing { filter: brightness(.92); }
.slot.empty .plus { opacity: .55; }
.slot.lifted > * { opacity: 0; }
.slot.lifted { background: var(--paper); box-shadow: inset 0 0 0 1.5px var(--hairline); }
.slot.drop-into { box-shadow: inset 0 0 0 3px var(--paper), inset 0 0 0 6px var(--ink); }
.slot.drop-into .box { transform: scale(.82); transition: transform .15s ease; }
.slot.ghost { position: fixed; left: 0; top: 0; z-index: 50; pointer-events: none; opacity: .95; outline: 1.5px solid var(--ink); transition: none; }
.slot.editing { box-shadow: inset 0 0 0 3px var(--paper), inset 0 0 0 5px var(--ink); }
.box { position: absolute; inset: 22px 10px 18px; display: flex; align-items: center; justify-content: center; text-align: center; }
.t {
  display: block; max-width: 100%; min-width: 1ch; min-height: 1em; font-family: var(--tile-font); font-weight: 500; line-height: 1.08;
  letter-spacing: -.01em; overflow-wrap: normal; word-break: normal; outline: none; color: inherit;
}
.t.tight { overflow-wrap: anywhere; }
.t.untitled { opacity: .6; }
.tree .t.untitled { font-weight: 300; }
.t[contenteditable] { cursor: text; user-select: text; -webkit-user-select: text; caret-color: currentColor; }
.tree .t[contenteditable], #hText .t[contenteditable], #padText[contenteditable] { caret-color: transparent; } /* the phone's own caret has round ends: ours is a plain square bar (Bell) */
#hInput { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; font-size: 16px; border: 0; padding: 0; margin: 0; resize: none; background: transparent; color: transparent; caret-color: transparent; text-align: center; } #hText { position: fixed; z-index: 10; pointer-events: none; } #hText.editing { pointer-events: auto; } #hText .box, #hText canvas { position: absolute; inset: auto; } #hText canvas { display: block; } #hText [hidden] { display: none; }
#hText[hidden] { display: none; } body.sketchmode #hText .box, body.sketchmode #hText canvas { visibility: hidden; } /* sketching: the sharp copy keeps only the house itself, under the pad (Bell v239) */ .tree g[data-isle], .tree path.parcel, .tree path.farm, .tree .tsq { transition: opacity .5s; }
.tree .tsq.htext > .box, .tree .tsq.htext > canvas.sk { visibility: hidden; } .tree .tsq.htext { background: transparent !important; } .tree .tsq.htext::before { display: none; } #hText .bg, #hText .pz { position: absolute; left: 0; top: 0; }
#caret { position: fixed; z-index: 40; width: 2px; pointer-events: none; animation: caretBlink 1.05s steps(1) infinite; }
#caret[hidden], body.sketchmode #caret { display: none !important; }
body.sketchmode, body.sketchmode * { user-select: none !important; -webkit-user-select: none !important; -webkit-touch-callout: none !important; } /* sketching: nothing gets selected (Bell v182) */
@keyframes caretBlink { 50% { opacity: 0; } }
.plus { position: absolute; inset: 0; display: grid; place-items: center; font: 300 36px/1 var(--sans); }
.padbtn { position: absolute; right: 2px; top: 2px; width: 36px; height: 36px; display: grid; place-items: center; opacity: .55; }
.padbtn .ic { width: 16px; height: 16px; }
.fcbtn { position: absolute; right: 2px; top: 2px; z-index: 3; width: 40px; height: 40px; display: grid; place-items: center; }
.fcbtn .ic { width: 22px; height: 22px; }
.fcbar { position: absolute; left: 4px; right: 44px; top: 6px; height: 34px; z-index: 2; display: flex; align-items: center; gap: 6px; padding: 0 4px; overflow-x: auto; scrollbar-width: none; }
.fcbar::-webkit-scrollbar { display: none; }
.fcbar[hidden] { display: none; }
.fcbar button { flex: none; width: 24px; height: 24px; border-radius: 9999px; box-shadow: inset 0 0 0 1px rgba(127, 127, 127, .6); font: 500 12px/24px var(--sans); color: inherit; }
.fcbar button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--tile), 0 0 0 3.5px currentColor; }
.padbtn.has { opacity: 1; }
.mini { position: absolute; left: 10px; bottom: 8px; display: flex; align-items: center; gap: 5px; pointer-events: none; font: 400 12px/16px var(--tile-font); letter-spacing: .02em; opacity: .8; }
.mini svg { width: 11px; height: 11px; }
.slot > canvas.sk, .tsq > canvas.sk { position: absolute; inset: 0; display: block; pointer-events: none; }

#hint { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; text-align: center; pointer-events: none; background: none !important; border: 0 !important; padding: 0 16px calc(16px + env(safe-area-inset-bottom, 0px)) !important; } /* no bar: pill buttons float over the bottom of the sea (Bell v175) */
#hint .zoom button { pointer-events: auto; }
#hint.old { padding: 8px 16px 10px; text-align: center; color: var(--muted); font: 400 13px/18px var(--sans); letter-spacing: .02em; min-height: 36px; border-top: 1px solid var(--hairline); }

/* Mind tree: sky field, umber trunk, forest leaves, ochre ground */
.v-tree { scroll-snap-type: none; overflow: auto; touch-action: pan-x pan-y; background: var(--cobalt); }
.tree-sizer { position: relative; } .tree .mvRing { position: absolute; pointer-events: none; border-radius: 18%; box-sizing: border-box; } .tree .mvRing.to { border: calc(var(--lw) * 2.4) solid #fff; background: rgba(255,255,255,.18); } .tree .mvRing.from { border: calc(var(--lw) * 1.6) dashed rgba(255,255,255,.75); } .tree .moving { pointer-events: none !important; } .tree .tsq.moving { z-index: 5; } /* hold and drag a house (Bell v260) */ .nText { position: absolute; left: 0; top: 0; width: 0; height: 0; pointer-events: none; z-index: 2; } .nText > div { position: absolute; display: flex; align-items: center; justify-content: center; text-align: center; } .nText .t { max-width: 100%; } .tree .t.ntx, .tree .tsq.nhx > .hol, .tree .tsq.nhx > .hfill { visibility: hidden; } /* names zoomed in: drawn again at screen size, sharp (Bell v253) */
/* canvas mode is the house's parcel as it is, with the edit buttons added: no black, no zoom (Bell v215) */
#stage.hfoc .tree > .art .walls { display: none; } /* the walls' outline lies over the house: gone in canvas mode (Bell saw a line at the attic) */
#stage.hfoc .tree .tsq .t.untitled, #hText .t.untitled { visibility: hidden; } /* canvas mode: no plus inside the empty house (Bell) */ /* a house fills the screen: everything round it is black (its own rule shows it) */
.tree { position: absolute; transform-origin: 0 0; }
.tree .art { position: absolute; left: 0; top: 0; }
/* Line weights follow the zoom: they thin out as you zoom in, so an island seen up close keeps fine lines (set in applyZoom) */
.tree .sand { fill: var(--d-green); stroke: none; }
.tree .parcel[data-ppath] { cursor: pointer; }
.tree .parcel { fill: #328F66; stroke: none; } .tree .parcel.pd2 { fill: #267B55; } .tree .parcel.pd3 { fill: #1C6544; } .tree .parcel.pd4 { fill: #134D33; } .tree .parcel.pd5 { fill: #0B3422; } .tree .parcel.pd6 { fill: #051A10; } /* 6 parcel layers, even steps darker (Bell v262) */ /* wobbly patches of land, darker green each layer in, no lot lines (Bell v236) */ /* wobbly patches of land, lighter each layer in (Bell v185) */
.tree .tsq { clip-path: polygon(0 var(--roof), 50% 0, 100% var(--roof), 100% 100%, 0 100%); }
.tree .tsq .box { inset: calc(var(--roof) + 4.55%) 4.76% 4.55%; } /* margins in proportion to the house, so a name takes the same share of a small house as of a big one (Bell v221) */
.tree .tsq > canvas.sk.body { top: var(--roof); }
.tree .tsq.sketching > canvas.sk { visibility: hidden; }
.tree .tsq .hgrid { position: absolute; inset: 0; display: flex; flex-direction: column; }
.tree .tsq .hrow { flex: 1 1 0; display: flex; min-height: 0; }
.tree .tsq .hrow:first-child { flex: 0 0 calc((100% - var(--roof)) / var(--rows, 1) + var(--roof)); }
.tree .tsq .hrow:first-child .box { top: calc(var(--roof) * .75); }
.tree .tsq .hcell { flex: 1; position: relative; overflow: hidden; background: var(--tile); color: var(--on); box-shadow: inset 0 0 0 .4px #000; }
.tree .tsq .hcell > canvas.sk { position: absolute; inset: 0; display: block; pointer-events: none; }
.tree .tsq .hcell .box { inset: 4px; }
.tree .tsq .hplus { position: absolute; left: 0; right: 0; top: var(--roof); bottom: 0; display: grid; place-items: center; font: 300 56px/1 var(--sans); color: currentColor; background: none; border: 0; }
.tree .walls { pointer-events: none; }
.tree .walls path { fill: none; stroke: #000; stroke-width: calc(var(--lw, 1.5px) * 1.4); stroke-linejoin: miter; } /* as thick as the bar icons (Bell v194) */
.tree .tsq { outline-width: var(--lw, 1.5px); }
.tree .house-name { fill: #FFFFFF; font: 500 12px var(--tile-font); text-transform: lowercase; cursor: pointer; }
.tree .tsq { outline: none; } .tree .tsq:not(.open) { background: transparent; } .tree .tsq .hfill { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; } .tree .tsq .hfill path { fill: var(--tile); } .tree .tsq.htext > .hfill, .tree .tsq.htext > .hol { visibility: hidden; } #hText svg.ln { position: absolute; left: 0; top: 0; pointer-events: none; } #hText svg.ln path { fill: none; stroke: #FFF; } .tree .tsq.ol > .hol, .tree .tsq.ol > .hfill { display: none; } .tree .farm { pointer-events: none; } .tree path.farm { display: none; } .tree g.fart path.farm { display: inline; } .tree g.fart { pointer-events: none; } .tree .tsq canvas.sk, #hText canvas { display: none !important; } #hText.inner .bg, #hText.inner svg.ln { display: none !important; } body.skon .tree .tsq .hfill path { fill: transparent !important; } body.skon #hText .bg { visibility: hidden !important; } /* a sketch showing: house colour see-through, only its line and name over it (Bell v269) */ /* one sketch or pattern at a time, on the parcel or island filling the screen (Bell v268) */ .tree .tsq .hol { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; } .tree .tsq .hol path { fill: none; stroke: #FFF; } /* white house lines and white names (Bell v240) */ /* inner houses: an outline only (Bell v238) */
.tree .isle-name { fill: #FFFFFF; font: 400 20px var(--serif); letter-spacing: .16em; text-transform: uppercase; cursor: pointer; }
.tsq { position: absolute; overflow: hidden; background: var(--tile, #F2EDE4); color: var(--on, #000); cursor: pointer; outline: 1.5px solid #000; }
.tsq .box { inset: 6px; }
.tsq.room .box { inset: 3px; }
.tree-empty { color: #000; font: 400 18px/28px var(--serif); padding: 16px; }
#hint .zoom { display: inline-flex; gap: 10px; margin-left: 0; vertical-align: middle; }
#hint .zoom button { width: 34px; height: 30px; border: 1.5px solid var(--ink); border-radius: 2px; font: 400 18px/1 var(--sans); color: var(--ink); }
#hint .zoom button.wide { width: auto; padding: 0 12px; font-size: 15px; letter-spacing: .02em; }
#hint .zoom button.wide.sign:not(.hb) { height: 44px; width: 44px; min-width: 0; padding: 0; border-radius: 999px; border: 0; background: none; box-shadow: none; /* no circle: just the icon on the sea (Bell v186) */ display: inline-grid; place-items: center; }
#hint .zoom button.wide.sign.on { background: none; color: #000; }
#hint .zoom button.wide.sign:disabled { opacity: 1; color: rgba(0,0,0,.3); }
#hint .zoom button.wide + button:not(.wide) { margin-left: 8px; }
#hint .ic.isl { width: 34px; height: 34px; stroke-linecap: round; stroke-linejoin: round; }
#hint .zoom .hb, #hint.house #addIsleBtn, #hint.house #delIsleBtn, #hint.house #growBtn, #hint.house #zoomAllBtn, #hint.house #parcelUpBtn { display: none !important; }
#hint.house .zoom .hb { display: inline-grid; place-items: center; }
#hint.house { display: none; } /* canvas mode: no bottom bar at all (Bell); a tap on the black goes back */
#hint .zoom .hb .ic, #hint .zoom .hu .ic { width: 22px; height: 22px; }
#hint .zoom .hu { display: inline-grid; place-items: center; }
#hint .zoom button:disabled { opacity: .3; cursor: default; }

/* Bottom sheet */
#sheet { position: fixed; inset: 0; z-index: 40; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; }
.panel {
  width: 100%; max-width: 520px; background: var(--paper); color: var(--ink); border-top: 3px solid var(--ink);
  padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 4px;
}
.panel h2 { margin: 0 0 8px; font: 400 26px/32px var(--serif); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.panel p { margin: 0 0 8px; color: var(--muted); font: 400 17px/24px var(--serif); }
.row-btn { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 48px; padding: 0 4px; border-bottom: 1px solid var(--hairline); font: 400 15px/20px var(--sans); letter-spacing: .04em; text-transform: uppercase; text-align: left; }
.row-btn:hover { color: var(--link); }
.row-btn.armed { background: var(--ink); color: var(--paper); padding: 0 12px; text-transform: none; letter-spacing: .02em; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 0 12px; border-bottom: 1px solid var(--hairline); }
.sw { width: 36px; height: 36px; border-radius: 0; outline: 1px solid var(--hairline); display: grid; place-items: center; font: 400 11px/1 var(--sans); letter-spacing: .04em; text-transform: uppercase; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--ink); }
.panel textarea { width: 100%; min-height: 120px; resize: vertical; border: 1.5px solid var(--ink); border-radius: 2px; padding: 10px; color: var(--ink); cursor: text; font: 13px/1.4 ui-monospace, Menlo, monospace; letter-spacing: 0; }

/* Sketching: the square grows to fill the screen and is drawn on directly */
#pad { position: fixed; inset: 0; z-index: 30; background: var(--paper); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
.padhead { display: flex; align-items: center; gap: 12px; padding: 10px 16px 10px; height: 73px; flex: none; width: 100%; border-bottom: 3px solid var(--ink); }
#padTitle { flex: 1; min-width: 0; position: relative; top: .11em; }
#padTitle[contenteditable="true"] { outline: none; border-bottom: 1.5px dashed currentColor; cursor: text; }
#padTitle[contenteditable="true"]:empty::before { content: attr(data-placeholder); opacity: .45; }
#hint .zoom button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.tree [data-isle] { cursor: pointer; }
#pad .padhead .round + .round { margin-left: -4px; }
#pad .padhead .round:disabled { opacity: .3; }
.tray { position: relative; flex: none; height: calc(78px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: flex-start; justify-content: center; gap: 14px; padding: 0 16px; overflow: visible; border-top: 1px solid var(--hairline); background: var(--paper); }
.tray .pen { width: 30px; height: 78px; overflow: hidden; padding: 0; }
.tray .pen svg { display: block; width: 30px; height: 86px; transform: translateY(14px); transition: transform .18s ease-out; }
.tray .pen[aria-pressed="true"] svg { transform: translateY(-2px); }
.tray .body { fill: #111111; stroke: rgba(127, 127, 127, .55); stroke-width: .8; }
.tray .tipc { fill: var(--pen, #000); }
.tray .wheel { align-self: center; margin-left: 6px; width: 34px; height: 34px; border-radius: 9999px; display: grid; place-items: center; background: conic-gradient(#FF453A, #FFD60A, #30D158, #64D2FF, #0A84FF, #BF5AF2, #FF375F, #FF453A); }
.tray .wheel span { width: 22px; height: 22px; border-radius: 9999px; background: var(--pen, #000); box-shadow: 0 0 0 2.5px var(--paper); }
.swatchpop { position: absolute; right: 12px; bottom: calc(100% + 8px); z-index: 2; display: grid; grid-template-columns: repeat(6, 32px); gap: 10px; padding: 14px; background: var(--paper); border: 1.5px solid var(--ink); }
.swatchpop[hidden] { display: none; }
.swatchpop button { width: 32px; height: 32px; border-radius: 9999px; box-shadow: inset 0 0 0 1px rgba(127, 127, 127, .5); }
.swatchpop .anycolor { position: relative; width: 32px; height: 32px; border-radius: 9999px; background: conic-gradient(#FF453A, #FFD60A, #30D158, #64D2FF, #0A84FF, #BF5AF2, #FF375F, #FF453A); cursor: pointer; }
.swatchpop .anycolor.on { box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--ink); }
.swatchpop .anycolor input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; padding: 0; }
.swatchpop button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--ink); }
.scroller { flex: 1; min-height: 0; display: grid; place-items: center; overflow: hidden; }
.page { position: relative; width: var(--pw, 100%); height: var(--ph, 100%); background: var(--tile, #F2EDE4); color: var(--on, #000); transform-origin: 0 0; }
.page canvas { position: absolute; left: 0; top: 0; pointer-events: none; }
#pad canvas.live { pointer-events: auto; touch-action: none; cursor: crosshair; }
#pad.inplace { background: transparent; }
#pad.inplace .padhead, #pad.inplace .tray { position: relative; z-index: 2; }
#pad.inplace .padhead { border-bottom: 0; }
#pad.inplace #padTitle { visibility: hidden; }
#pad.inplace .padhead .round { background: var(--paper); }
#pad .padedit { height: 40px; padding: 0 14px; border: 1.5px solid var(--ink); border-radius: 2px; background: var(--paper); color: var(--ink); font: 400 15px/1 var(--sans); }
#pad .padedit[hidden], #pad .round[hidden] { display: none; }
#pad:not(.inplace) .texttool, #pad:not(.inplace) #padTextBox { display: none; }
.tray .texttool { align-self: center; width: 40px; height: 40px; border: 1.5px solid var(--ink); border-radius: 2px; font: 500 17px/1 var(--tile-font); }
.tray .texttool[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
#pad.inplace #padTextBox { inset: auto; left: var(--tb); right: var(--tb); top: calc(var(--rp) + var(--tb)); bottom: var(--tb); pointer-events: none; }
#pad.typing #padTextBox { pointer-events: auto; }
#pad.sketchonly .texttool, #pad.sketchonly #padTextBox { display: none !important; } #pad.sketchonly #padTitle { visibility: hidden; } /* Sketch: no text on the canvas, no text tools */
#pad.typing canvas.live { pointer-events: none; }
.tree .tsq.sketching > .box { visibility: hidden; }
.empty-map { position: relative; width: 100%; }
.empty-map .isle-restore { position: absolute; left: 50%; bottom: calc(40px + env(safe-area-inset-bottom)); transform: translateX(-50%); height: 40px; padding: 0 16px; border: 1.5px solid #FFF; border-radius: 10px; background: none; color: #FFF; font: 500 15px/1 var(--sans); }
.empty-map .isle-plus { position: absolute; left: 50%; top: 50%; width: 96px; height: 96px; transform: translate(-50%, -50%); display: grid; place-items: center; border: 0; background: none; color: #FFF; font: 200 92px/1 var(--sans); cursor: pointer; }
#pad.inplace .page { position: fixed; background: transparent; clip-path: polygon(0 var(--rp), 50% 0, 100% var(--rp), 100% 100%, 0 100%); }

#toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60;
  max-width: calc(100% - 32px); padding: 12px 18px; background: #000; color: #FFF; outline: 1px solid #333;
  font: 400 17px/24px var(--serif);
}
@media (prefers-reduced-motion: reduce) { .slot { transition: none; } }

/* A house up close on the map: Edit at the top right opens Type, Sketch and Colour */
#app { position: relative; }
#houseTools { position: absolute; top: 12px; right: 12px; z-index: 20; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
#houseTools[hidden], #houseMenu[hidden], #lookSheet[hidden] { display: none; }
#houseTools button, #lookSheet .done { height: 34px; padding: 0 14px; border: 1.5px solid var(--ink); border-radius: 2px; background: var(--paper); color: var(--ink); font: 400 15px/1 var(--sans); letter-spacing: .02em; }
#houseEdit[aria-expanded="true"] { background: var(--ink); color: var(--paper); }
#houseMenu { display: flex; flex-direction: row; gap: 8px; }
#houseTools { left: 12px; flex-direction: row; justify-content: space-between; align-items: flex-start; } /* canvas mode: back at the left, the three symbols at the right (Bell) */
#houseTools button.hic, #lookSheet .done.hic { width: 40px; height: 40px; min-width: 0; padding: 0; display: grid; place-items: center; }
#houseTools .hic .ic, #lookSheet .hic .ic { width: 20px; height: 20px; stroke-width: 1.6; }
#houseBackTop[hidden] { display: none; }
button.islb, #lookSheet button.done.islb { width: 44px; height: 44px; min-width: 0; padding: 0; border: 0 !important; background: none !important; box-shadow: none !important; color: var(--ink) !important; display: inline-grid; place-items: center; } button.islb .ic.isl { width: 34px; height: 34px; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; transform: none; } button.islb:disabled { opacity: .35; }
#houseTools button.hic { width: 44px; height: 44px; border: 0; background: none; box-shadow: none; color: var(--ink); } #houseMenu .hic[hidden] { display: none; } #houseMenu .hic.on { background: rgba(255,255,255,.22) !important; border-radius: 50%; } #houseTools .hic .ic.isl { width: 34px; height: 34px; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; } /* bare island-outline icons like the lower bar (Bell v224) */
#houseTools { pointer-events: none; } #houseTools button { pointer-events: auto; }

button, #bkSheet, #hint, #houseTools { touch-action: manipulation; } /* no double-tap zoom on buttons (Bell v276: the page zoomed after Save a backup) */
#bkSheet { position: absolute; left: 12px; right: 12px; bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 22; background: var(--paper); color: var(--ink); border: 1.5px solid var(--ink); border-radius: 14px; padding: 12px; display: grid; gap: 8px; } #bkSheet[hidden] { display: none; } #bkSheet button { height: 44px; border: 1.5px solid var(--ink); border-radius: 10px; background: none; color: var(--ink); font: 500 16px/1 var(--sans); } #bkSheet p { margin: 2px 4px 0; font: 400 13px/1.35 var(--sans); opacity: .75; } /* backup and restore (v273) */
#lookSheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--paper); border-top: 1.5px solid var(--ink); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
#lookSheet h2 { margin: 0 0 8px; font: 400 13px/18px var(--sans); letter-spacing: .02em; color: var(--muted); }
#lookSheet .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
#lookSheet .row button { width: 40px; height: 40px; border: 1.5px solid var(--ink); border-radius: 2px; position: relative; overflow: hidden; background: var(--tile); color: var(--on); font: 400 11px/1 var(--sans); }
#lookSheet .row button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--ink); }
#lookSheet .done { float: right; margin-top: -4px; }
#lookSheet .row button.aa { font: 500 17px/1 var(--tile-font); }
/* compact (Bell v226): each set on one sliding row, small swatches, so the house and its name stay in view */
#lookSheet { padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); }
#lookSheet h2 { margin: 0 0 4px; font-size: 11px; line-height: 14px; }
#lookSheet .row { flex-wrap: nowrap; overflow-x: auto; gap: 6px; margin-bottom: 8px; padding: 3px; margin-left: -3px; margin-right: -3px; scrollbar-width: none; }
#lookSheet .row::-webkit-scrollbar { display: none; }
#lookSheet .row button { flex: 0 0 auto; width: 28px; height: 28px; font-size: 9px; }
#lookSheet .row button.aa { font-size: 13px; }
#lookSheet .row button[aria-pressed="true"] { box-shadow: 0 0 0 1.5px var(--paper), 0 0 0 3px var(--ink); }
#lookSheet #lookDone, #lookSheet h2 { display: none !important; } /* no titles either (Bell v230) */ /* (no tick: the colour button closes it, Bell v228) */
#lookSheet .done { position: absolute; top: 0; right: 6px; float: none; margin: 0; } #lookSheet button.done.islb { width: 30px; height: 30px; } #lookSheet .done .ic.isl { width: 26px; height: 26px; }
/* patterns a house or square can carry, drawn in its text colour over its tile colour */
[data-pat]::before { content: ''; position: absolute; inset: 0; pointer-events: none; opacity: .22; }
.tree [data-pat]::before, #hText [data-pat]::before { display: none; } /* no patterns on the houses (Bell v227) */
[data-pat="stripes"]::before { background: repeating-linear-gradient(45deg, currentColor 0 3px, transparent 3px 12px); }
[data-pat="lines"]::before { background: repeating-linear-gradient(0deg, currentColor 0 2px, transparent 2px 10px); }
[data-pat="dots"]::before { background: radial-gradient(currentColor 2px, transparent 2.5px) 0 0 / 12px 12px; }
[data-pat="grid"]::before { background: linear-gradient(currentColor 1.5px, transparent 1.5px) 0 0 / 14px 14px, linear-gradient(90deg, currentColor 1.5px, transparent 1.5px) 0 0 / 14px 14px; }
[data-pat="checks"]::before { background: conic-gradient(currentColor 25%, transparent 0 50%, currentColor 0 75%, transparent 0) 0 0 / 16px 16px; }
</style>

</head>
<body>
<div id="app">
  <header id="bar"></header>
  <main id="stage"></main>
  <footer id="hint"></footer>
  <div id="houseTools" hidden>
    <button id="houseEdit" hidden>Edit</button>
    <button id="houseBackTop" class="hic" aria-label="Back"><svg class="ic" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div id="houseMenu" hidden><button class="hic" data-act="type" aria-label="Type"><svg class="ic" viewBox="0 0 24 24"><path d="M5 5.5h14M12 5.5V20"/></svg></button><button class="hic" data-act="sketch" aria-label="Sketch"><svg class="ic" viewBox="0 0 24 24"><path d="M4 20l1.2-4.8L15.5 4.9l3.6 3.6L8.8 18.8zM13.5 6.9l3.6 3.6"/></svg></button><button class="hic" data-act="pat" aria-label="Pattern from sketch"><svg class="ic" viewBox="0 0 24 24"><path d="M5.5 6.5h3M5.5 15.5h3M10.5 11h3M10.5 20h3M15.5 6.5h3M15.5 15.5h3"/></svg></button><button class="hic" data-act="look" aria-label="Color"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3.5c3.6 4.4 6 7.6 6 10.9a6 6 0 0 1-12 0c0-3.3 2.4-6.5 6-10.9z"/></svg></button></div>
  </div>
  <div id="bkSheet" hidden><button id="bkSave">Save a backup</button><button id="bkLoad">Restore a backup</button><p>Your thoughts are kept on this phone. Save a backup to Files now and then; restore puts a saved backup back.</p><input id="bkFile" type="file" accept=".json,application/json" hidden></div>
  <div id="lookSheet" hidden aria-label="Color and pattern">
    <button class="done hic" id="lookDone" hidden aria-label="Done"><svg class="ic" viewBox="0 0 24 24"><path d="M4.5 12.5l5 5 10-11"/></svg></button>
    <h2>Color</h2><div class="row" id="lookColors"></div>
    <h2>Text color</h2><div class="row" id="lookText"></div>

</div>

<section id="pad" hidden aria-label="Sketch">

<div id="sheet" hidden><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>

<script>
(() => {
'use strict';
const KEY = 'thoughts.v1';
const $ = (s, r = document) => r.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
/* Palette E (Painted jungle) from the Thoughts design system: [name, fill, text, hue family, share of tiles] */
const HOUSE = { roof: 36, w: 126, h: 96 }; // a house on the map: its roof and its body
// Farmland (Bell v241): every island and parcel is ploughed in one of six field patterns, laid over its own green; all in one light tint (Bell v244)
const FARM_GREEN = ['#41A67A', '#328F66', '#267B55', '#1C6544', '#134D33', '#0B3422', '#051A10']; const MAX_PATH = 7; // an island's house and up to 6 parcel layers under it (Bell v262) // the island, then each parcel layer in (as .tree .parcel)
const farmOf = key => { let h = 2166136261; for (const ch of String(key)) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return ((h ^ (h >>> 15)) >>> 0) % 6; };
// a parcel's pattern is never the one of the land around it, and houses side by side in one parcel each get their own (Bell v246)
const farmFor = path => { if (!path || !path.length) return 0; const up = path.length === 1 ? farmOf(path[0]) : farmFor(path.slice(0, -1));
  const k = path.length === 1 ? 0 : Math.max(0, compact(path[path.length - 2]).indexOf(path[path.length - 1])); return (up + 1 + k % 5) % 6; };
const FARM_DEFS = `<defs>
  <pattern id="farm0" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="1.6" fill="rgba(255,255,255,.16)"/></pattern>
  <pattern id="farm1" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(35)"><rect width="1.6" height="7" fill="rgba(255,255,255,.16)"/></pattern>
  <pattern id="farm2" patternUnits="userSpaceOnUse" width="8" height="8"><circle cx="2" cy="2" r="1.1" fill="rgba(255,255,255,.16)"/><circle cx="6" cy="6" r="1.1" fill="rgba(255,255,255,.16)"/></pattern>
  <pattern id="farm3" patternUnits="userSpaceOnUse" width="9" height="9"><path d="M0 0H9M0 0V9" stroke="rgba(255,255,255,.16)" stroke-width="1.6" fill="none"/></pattern>
  <pattern id="farm4" patternUnits="userSpaceOnUse" width="10" height="6"><path d="M0 3Q2.5 0 5 3T10 3" stroke="rgba(255,255,255,.16)" stroke-width="1.6" fill="none"/></pattern>
  <pattern id="farm5" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(-50)"><rect width="6" height="1.6" fill="rgba(255,255,255,.16)"/><rect y="3" width="6" height="1.6" fill="rgba(255,255,255,.16)"/></pattern>
  <!-- parcels inside an island: the same patterns in dark grey (Bell v257) -->
  <pattern id="farmD0" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="1.6" fill="rgba(25,25,25,.35)"/></pattern>
  <pattern id="farmD1" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(35)"><rect width="1.6" height="7" fill="rgba(25,25,25,.35)"/></pattern>
  <pattern id="farmD2" patternUnits="userSpaceOnUse" width="8" height="8"><circle cx="2" cy="2" r="1.1" fill="rgba(25,25,25,.35)"/><circle cx="6" cy="6" r="1.1" fill="rgba(25,25,25,.35)"/></pattern>
  <pattern id="farmD3" patternUnits="userSpaceOnUse" width="9" height="9"><path d="M0 0H9M0 0V9" stroke="rgba(25,25,25,.35)" stroke-width="1.6" fill="none"/></pattern>
  <pattern id="farmD4" patternUnits="userSpaceOnUse" width="10" height="6"><path d="M0 3Q2.5 0 5 3T10 3" stroke="rgba(25,25,25,.35)" stroke-width="1.6" fill="none"/></pattern>
  <pattern id="farmD5" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(-50)"><rect width="6" height="1.6" fill="rgba(25,25,25,.35)"/><rect y="3" width="6" height="1.6" fill="rgba(25,25,25,.35)"/></pattern>
</defs>`;
const PAL = [
  ['paper', '#F2EDE4', '#000', 'white', .33], ['orange', '#F6720D', '#000', 'orange', .14], ['sky', '#64ACC9', '#000', 'blue', .14],
